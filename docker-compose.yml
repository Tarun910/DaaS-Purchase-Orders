services:
  postgres:
    image: postgres:16-alpine
    container_name: daas-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: daas
      POSTGRES_PASSWORD: daas
      POSTGRES_DB: daas
    volumes:
      - daas_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daas -d daas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  daas_pg_data:
